name: iOS 构建与自验

on:
  push:
    paths-ignore:
      - 'Reports/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: 构建、XCTest 与未签名产物
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: 检出源码
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          authorization="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\r\n')"
          git -c http.extraheader="AUTHORIZATION: basic $authorization" \
            fetch --no-tags --depth=50 origin "$GITHUB_SHA"
          unset authorization GITHUB_TOKEN
          git checkout --detach FETCH_HEAD

      - name: 选择 Xcode 26 工具链（IC-116）
        run: |
          set -euo pipefail
          echo "== ls /Applications 实证 =="
          ls /Applications | grep -E '^Xcode'
          xcode_app="$(
            ls /Applications |
              grep -E '^Xcode_26(\.[0-9]+)*\.app$' |
              sort -V | tail -n 1 || true
          )"
          if [ -z "$xcode_app" ]; then
            echo "错误：runner 上不存在 Xcode 26 稳定版（命名 Xcode_26*.app 且不含 beta）。" >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=/Applications/$xcode_app/Contents/Developer" >> "$GITHUB_ENV"
          echo "已选择工具链：/Applications/$xcode_app"

      - name: 显示 Xcode 环境
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: 运行结构自验
        shell: pwsh
        run: ./Scripts/selfcheck.ps1

      - name: 扫描用户可见硬编码字符串
        shell: pwsh
        run: ./Scripts/scan-hardcoded-user-visible-strings.ps1

      - name: 自测项数统计逻辑（IC-149 子项 B）
        run: |
          set -o pipefail
          set -u
          selftest_failures=0

          expect_field() {
            fixture_name="$1"
            field_name="$2"
            want_value="$3"
            got_value="$(
              bash Scripts/summarize-xctest-log.sh "Scripts/fixtures/${fixture_name}" |
                /usr/bin/sed -n "s/^${field_name}=//p"
            )"
            if [ "${got_value}" = "${want_value}" ]; then
              echo "OK ${fixture_name} ${field_name}=${got_value}"
            else
              echo "::error title=项数统计自测::${fixture_name} 的 ${field_name} 期望 ${want_value}，实得 ${got_value}"
              selftest_failures=$((selftest_failures + 1))
            fi
          }

          expect_field xctest-single-chunk.log executed_count 6
          expect_field xctest-single-chunk.log failed_case_count 0
          expect_field xctest-single-chunk.log restart_count 0
          expect_field xctest-restarted.log executed_count 8
          expect_field xctest-restarted.log failed_case_count 1
          expect_field xctest-restarted.log restart_count 1
          expect_field xctest-zero.log executed_count 0
          expect_field xctest-zero.log restart_count 0

          # 负对照：改前的 `tail -n 1` 口径在重启夹具上必须给出**错误**答案。
          # 没有这一条，夹具有可能根本不区分新旧口径，自测就成了空转。
          old_logic_count="$(
            /usr/bin/grep -E 'Executed [0-9]+ tests?' Scripts/fixtures/xctest-restarted.log |
              tail -n 1 |
              /usr/bin/sed -nE 's/.*Executed ([0-9]+) tests?.*/\1/p'
          )"
          if [ "${old_logic_count}" = "8" ]; then
            echo "::error title=项数统计自测::重启夹具未能区分新旧口径（旧口径也给出 8），失去负对照作用。"
            selftest_failures=$((selftest_failures + 1))
          else
            echo "OK 负对照：旧 tail -n 1 口径在重启夹具上给出 ${old_logic_count}，真实项数为 8"
          fi

          # IC-125 哨兵口径不变：零项日志经新逻辑取出的执行数仍须 <= 0。
          zero_summary="$(
            bash Scripts/summarize-xctest-log.sh Scripts/fixtures/xctest-zero.log |
              /usr/bin/sed -n 's/^summary_line=//p'
          )"
          zero_count="$(
            printf '%s\n' "${zero_summary}" |
              /usr/bin/sed -nE 's/.*Executed ([0-9]+) tests?.*/\1/p'
          )"
          if [ -z "${zero_count}" ] || [ "${zero_count}" -gt 0 ]; then
            echo "::error title=项数统计自测::零项日志的哨兵取值为 ${zero_count:-空}，哨兵不会判红。"
            selftest_failures=$((selftest_failures + 1))
          else
            echo "OK 哨兵口径：零项日志取值 ${zero_count}，哨兵路径仍判失败"
          fi

          if [ "${selftest_failures}" -ne 0 ]; then
            echo "统计逻辑自测失败 ${selftest_failures} 项。" >&2
            exit 1
          fi
          echo "统计逻辑自测通过。"

      - name: 运行 XCTest
        run: |
          set -o pipefail
          echo "== runner bash 实证（IC-125）=="
          command -v bash
          bash --version | head -n 1
          test_log="$(mktemp -t PhotoCleanupMVE-xctest.XXXXXX)"
          if bash Scripts/test-xcode.sh 2>&1 | tee "$test_log"; then
            test_status=0
          else
            test_status=$?
          fi

          # IC-149 子项 B：项数改由 Scripts/summarize-xctest-log.sh 按「唯一 Test Case
          # 身份去重」统计。旧的 `tail -n 1` 取的是最后一段小计，测试宿主崩溃重启后
          # 日志分段，摘要会少报项数并把前面段落的失败数报成 0（#292 attempt 1：
          # 真实 777 项、1 个用例失败，旧口径报 401 项 0 失败）。
          summary_output="$(bash Scripts/summarize-xctest-log.sh "$test_log" || true)"
          executed_line="$(
            printf '%s\n' "${summary_output}" |
              /usr/bin/sed -n 's/^summary_line=//p' || true
          )"
          restart_count="$(
            printf '%s\n' "${summary_output}" |
              /usr/bin/sed -n 's/^restart_count=//p' || true
          )"
          if [ -n "$executed_line" ]; then
            echo "::notice title=XCTest 执行摘要::$executed_line"
          fi
          if [ -n "${restart_count}" ] && [ "${restart_count}" -gt 0 ]; then
            echo "::notice title=XCTest 宿主重启::本次运行测试宿主重启 ${restart_count} 次，日志分成多段；执行摘要的项数按「唯一 Test Case 身份去重」统计，不取任何一段的 Executed 小计。"
          fi

          if [ "$test_status" -ne 0 ]; then
            failure_lines="$(
              /usr/bin/grep -E \
                'PhotoCleanupMVE/.*error:|PhotoCleanupMVETests/.*error:|Test Case .* failed' \
                "$test_log" | tail -n 50 || true
            )"
            if [ -n "$failure_lines" ]; then
              while IFS= read -r failure_line; do
                echo "::error title=XCTest 失败::$failure_line"
              done <<< "$failure_lines"
            else
              echo "::error title=XCTest 失败::未找到具体错误行。"
            fi
          fi

          # IC-125 哨兵：堵死「脚本没跑任何测试却以 0 退出」的假绿（#238 实例）。
          # 只在 test_status == 0 时介入；非 0 路径原样退出，保留 65 / 1 等失败模式区分。
          executed_count="$(
            printf '%s\n' "$executed_line" |
              /usr/bin/sed -nE 's/.*Executed ([0-9]+) tests?.*/\1/p' || true
          )"
          if [ "$test_status" -eq 0 ] && { [ -z "$executed_count" ] || [ "$executed_count" -le 0 ]; }; then
            echo "::error title=XCTest 哨兵::日志中未出现 Executed N tests（N>0），判定为未执行任何测试，即使退出码为 0 也判失败。test_status=${test_status} executed_count=${executed_count:-空}"
            exit 1
          fi
          exit "$test_status"

      - name: 构建未签名应用
        id: package
        run: |
          set -euo pipefail
          mkdir -p BuildArtifacts
          xcodebuild \
            build \
            -project PhotoCleanupMVE.xcodeproj \
            -scheme PhotoCleanupMVE \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath BuildArtifacts/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          app_path="BuildArtifacts/DerivedData/Build/Products/Release-iphoneos/PhotoCleanupMVE.app"
          if [ ! -d "$app_path" ]; then
            echo "错误：未找到构建后的 PhotoCleanupMVE.app。" >&2
            exit 1
          fi
          if /usr/bin/codesign -d "$app_path" >/dev/null 2>&1; then
            echo "错误：Release 应用意外带有代码签名。" >&2
            exit 1
          fi
          if [ -e "$app_path/_CodeSignature" ] || [ -e "$app_path/embedded.mobileprovision" ]; then
            echo "错误：Release 应用意外包含签名目录或描述文件。" >&2
            exit 1
          fi

          package_root="$(mktemp -d -t PhotoCleanupMVE-package.XXXXXX)"
          mkdir -p "$package_root/Payload"
          ditto "$app_path" "$package_root/Payload/PhotoCleanupMVE.app"
          ditto "$app_path" "BuildArtifacts/PhotoCleanupMVE-unsigned.app"
          (
            cd "$package_root"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/BuildArtifacts/PhotoCleanupMVE-unsigned.ipa" Payload
          )

          if [ ! -f BuildArtifacts/PhotoCleanupMVE-unsigned.ipa ] || \
             [ -L BuildArtifacts/PhotoCleanupMVE-unsigned.ipa ]; then
            echo "错误：IPA 不是预期的普通文件。" >&2
            exit 1
          fi
          test -s BuildArtifacts/PhotoCleanupMVE-unsigned.ipa
          /usr/bin/unzip -tq BuildArtifacts/PhotoCleanupMVE-unsigned.ipa
          ipa_size="$(stat -f '%z' BuildArtifacts/PhotoCleanupMVE-unsigned.ipa)"
          ipa_sha256="$(shasum -a 256 BuildArtifacts/PhotoCleanupMVE-unsigned.ipa | awk '{print $1}')"
          short_sha="$(git rev-parse --short=12 HEAD)"
          printf 'artifact_name=PhotoCleanupMVE-unsigned-%s\n' "$short_sha" >> "$GITHUB_OUTPUT"
          {
            echo "### 未签名 IPA"
            echo "- 文件：PhotoCleanupMVE-unsigned.ipa"
            echo "- 字节数：$ipa_size"
            echo "- SHA-256：$ipa_sha256"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "未签名 IPA 已生成：$ipa_size 字节，SHA-256=$ipa_sha256"
          echo "::notice title=未签名 IPA 校验::文件=PhotoCleanupMVE-unsigned.ipa，字节数=${ipa_size}，SHA-256=${ipa_sha256}"

      - name: 上传可下载的未签名 IPA
        id: upload_unsigned_ipa
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: BuildArtifacts/PhotoCleanupMVE-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          archive: true
