name: iOS 构建与自验

on:
  push:
    paths-ignore:
      - 'Reports/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: 构建、XCTest 与未签名产物
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 检出源码
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          authorization="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\r\n')"
          git -c http.extraheader="AUTHORIZATION: basic $authorization" \
            fetch --no-tags --depth=50 origin "$GITHUB_SHA"
          unset authorization GITHUB_TOKEN
          git checkout --detach FETCH_HEAD

      - name: 选择 Xcode 26 工具链（IC-116）
        run: |
          set -euo pipefail
          echo "== ls /Applications 实证 =="
          ls /Applications | grep -E '^Xcode'
          xcode_app="$(
            ls /Applications |
              grep -E '^Xcode_26(\.[0-9]+)*\.app$' |
              sort -V | tail -n 1 || true
          )"
          if [ -z "$xcode_app" ]; then
            echo "错误：runner 上不存在 Xcode 26 稳定版（命名 Xcode_26*.app 且不含 beta）。" >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=/Applications/$xcode_app/Contents/Developer" >> "$GITHUB_ENV"
          echo "已选择工具链：/Applications/$xcode_app"

      - name: 显示 Xcode 环境
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: 运行结构自验
        shell: pwsh
        run: ./Scripts/selfcheck.ps1

      - name: 扫描用户可见硬编码字符串
        shell: pwsh
        run: ./Scripts/scan-hardcoded-user-visible-strings.ps1

      - name: 自测项数统计逻辑（IC-149 子项 B）
        run: |
          set -o pipefail
          set -u
          selftest_failures=0

          expect_field() {
            fixture_name="$1"
            field_name="$2"
            want_value="$3"
            got_value="$(
              bash Scripts/summarize-xctest-log.sh "Scripts/fixtures/${fixture_name}" |
                /usr/bin/sed -n "s/^${field_name}=//p"
            )"
            if [ "${got_value}" = "${want_value}" ]; then
              echo "OK ${fixture_name} ${field_name}=${got_value}"
            else
              echo "::error title=项数统计自测::${fixture_name} 的 ${field_name} 期望 ${want_value}，实得 ${got_value}"
              selftest_failures=$((selftest_failures + 1))
            fi
          }

          expect_field xctest-single-chunk.log executed_count 6
          expect_field xctest-single-chunk.log failed_case_count 0
          expect_field xctest-single-chunk.log restart_count 0
          expect_field xctest-restarted.log executed_count 8
          expect_field xctest-restarted.log failed_case_count 1
          expect_field xctest-restarted.log restart_count 1
          expect_field xctest-zero.log executed_count 0
          expect_field xctest-zero.log restart_count 0

          # 负对照：改前的 `tail -n 1` 口径在重启夹具上必须给出**错误**答案。
          # 没有这一条，夹具有可能根本不区分新旧口径，自测就成了空转。
          old_logic_count="$(
            /usr/bin/grep -E 'Executed [0-9]+ tests?' Scripts/fixtures/xctest-restarted.log |
              tail -n 1 |
              /usr/bin/sed -nE 's/.*Executed ([0-9]+) tests?.*/\1/p'
          )"
          if [ "${old_logic_count}" = "8" ]; then
            echo "::error title=项数统计自测::重启夹具未能区分新旧口径（旧口径也给出 8），失去负对照作用。"
            selftest_failures=$((selftest_failures + 1))
          else
            echo "OK 负对照：旧 tail -n 1 口径在重启夹具上给出 ${old_logic_count}，真实项数为 8"
          fi

          # IC-125 哨兵口径不变：零项日志经新逻辑取出的执行数仍须 <= 0。
          zero_summary="$(
            bash Scripts/summarize-xctest-log.sh Scripts/fixtures/xctest-zero.log |
              /usr/bin/sed -n 's/^summary_line=//p'
          )"
          zero_count="$(
            printf '%s\n' "${zero_summary}" |
              /usr/bin/sed -nE 's/.*Executed ([0-9]+) tests?.*/\1/p'
          )"
          if [ -z "${zero_count}" ] || [ "${zero_count}" -gt 0 ]; then
            echo "::error title=项数统计自测::零项日志的哨兵取值为 ${zero_count:-空}，哨兵不会判红。"
            selftest_failures=$((selftest_failures + 1))
          else
            echo "OK 哨兵口径：零项日志取值 ${zero_count}，哨兵路径仍判失败"
          fi

          if [ "${selftest_failures}" -ne 0 ]; then
            echo "统计逻辑自测失败 ${selftest_failures} 项。" >&2
            exit 1
          fi
          echo "统计逻辑自测通过。"

      - name: 自测失败行提取（IC-154 子项 B）
        run: |
          set -o pipefail
          set -u
          selftest_failures=0
          selftest_dir="$(mktemp -d -t PhotoCleanupMVE-failure-extract.XXXXXX)"

          report_ok() {
            echo "OK $1"
          }
          report_failure() {
            echo "::error title=失败行提取自测::$1"
            selftest_failures=$((selftest_failures + 1))
          }
          output_field() {
            fixture_name="$1"
            field_name="$2"
            /usr/bin/sed -n "s/^${field_name}=//p" "${selftest_dir}/${fixture_name}.out"
          }
          output_section() {
            fixture_name="$1"
            section_name="$2"
            /usr/bin/awk -v wanted="--- ${section_name} ---" '
              /^--- [a-z]+ ---$/ { inside = ($0 == wanted); next }
              inside { print }
            ' "${selftest_dir}/${fixture_name}.out"
          }
          count_fixed() {
            printf '%s\n' "$1" | /usr/bin/grep -c -F -e "$2" || true
          }

          # 三份夹具各跑一遍，输出落盘后逐项取值；输出里一律不得出现 Executed 字样
          # （xctest-failures-many.log 的 :131 断言消息里故意带了两处，是这条的负对照）。
          for fixture_name in xctest-failures-many.log xctest-restarted.log xctest-single-chunk.log; do
            if bash Scripts/extract-xctest-failures.sh "Scripts/fixtures/${fixture_name}" > "${selftest_dir}/${fixture_name}.out"; then
              executed_mentions="$(/usr/bin/grep -c 'Executed' "${selftest_dir}/${fixture_name}.out" || true)"
              if [ "${executed_mentions}" = "0" ]; then
                report_ok "${fixture_name} 退出码 0，输出不含 Executed 字样"
              else
                report_failure "${fixture_name} 的输出含 Executed 字样 ${executed_mentions} 行。"
              fi
            else
              report_failure "${fixture_name} 上提取脚本退出码非 0。"
            fi
          done

          # 组一：xctest-failures-many.log。一只用例 32 个断言行失败、每条印两遍，其中 :161 在
          # 循环里以两种消息各失败一次（按「文件:行」只留首条）；该用例以 Test Case … failed 收尾，
          # 随后下一只用例触发 Fatal access conflict、宿主重启，第二段 3 个通过用例，** TEST FAILED **。
          # 候选 70 = 测试目标 error 行 66 + Test Case 失败行 1 + 结论行 3；
          # 去重 36 = 1 + 32 + 3（若按整行文本去重会得 37）。
          many_candidates="$(output_field xctest-failures-many.log candidate_count)"
          many_unique="$(output_field xctest-failures-many.log unique_count)"
          many_annotations="$(output_field xctest-failures-many.log annotation_count)"
          many_annotation_lines="$(output_section xctest-failures-many.log annotations)"
          many_all_lines="$(output_section xctest-failures-many.log all)"
          if [ -n "${many_candidates}" ] && [ "${many_candidates}" -gt 50 ]; then
            report_ok "组一 candidate_count=${many_candidates}（> 50）"
          else
            report_failure "组一 candidate_count 期望 > 50，实得 ${many_candidates:-空}"
          fi
          if [ "${many_unique}" = "36" ]; then
            report_ok "组一 unique_count=${many_unique}"
          else
            report_failure "组一 unique_count 期望 36，实得 ${many_unique:-空}"
          fi
          many_annotation_line_count="$(printf '%s\n' "${many_annotation_lines}" | /usr/bin/grep -c . || true)"
          if [ "${many_annotations}" = "10" ] && [ "${many_annotation_line_count}" = "10" ]; then
            report_ok "组一 annotation_count=${many_annotations}，annotations 段 ${many_annotation_line_count} 行"
          else
            report_failure "组一 annotation_count 期望 10，实得 ${many_annotations:-空}；annotations 段 ${many_annotation_line_count} 行"
          fi
          first_annotation="$(printf '%s\n' "${many_annotation_lines}" | /usr/bin/sed -n '1p')"
          case "${first_annotation}" in
            "Test Case "*" failed "*)
              report_ok "组一 annotations 段第 1 行是 Test Case … failed 行：${first_annotation}"
              ;;
            *)
              report_failure "组一 annotations 段第 1 行不是 Test Case … failed 行：${first_annotation:-空}"
              ;;
          esac
          many_restart_lines="$(count_fixed "${many_all_lines}" 'Restarting after unexpected exit')"
          many_test_failed_lines="$(count_fixed "${many_all_lines}" '** TEST FAILED **')"
          if [ "${many_restart_lines}" = "1" ] && [ "${many_test_failed_lines}" = "1" ]; then
            report_ok "组一 all 段含 Restarting after unexpected exit 行与 ** TEST FAILED ** 行"
          else
            report_failure "组一 all 段结论行不全：Restarting ${many_restart_lines} 行，TEST FAILED ${many_test_failed_lines} 行"
          fi
          many_order="$(
            printf '%s\n' "${many_all_lines}" |
              /usr/bin/awk '
                NR == 1 && $0 ~ /Test Case .* failed/ { head = head + 1 }
                NR >= 2 && NR <= 33 && $0 ~ /PhotoCleanupMVETests\/.*error:/ { middle = middle + 1 }
                NR >= 34 && NR <= 36 && ($0 ~ /^Fatal / || $0 ~ /^Restarting after/ || $0 ~ /TEST FAILED/) { tail = tail + 1 }
                END { printf "%d %d %d %d\n", head, middle, tail, NR }
              '
          )"
          if [ "${many_order}" = "1 32 3 36" ]; then
            report_ok "组一 all 段优先序：Test Case 失败行 1 → 测试目标 error 行 32 → 结论行 3（共 36 行）"
          else
            report_failure "组一 all 段优先序不符，期望「1 32 3 36」，实得「${many_order}」"
          fi

          # 组二：xctest-restarted.log（IC-149 既有夹具）。testCrashyOne 两条断言失败后宿主崩溃，
          # 夹具里本来就没有它的 Test Case … failed 行（崩溃的用例打不出结论行，#292 attempt 1 同形），
          # 故按结果核：去重后 ≥ 1、all 段含该用例的断言失败行，且输出里的 Test Case … failed 行数
          # 与夹具自身相同——脚本不凭空造行。
          restarted_unique="$(output_field xctest-restarted.log unique_count)"
          restarted_all_lines="$(output_section xctest-restarted.log all)"
          restarted_case_lines="$(count_fixed "${restarted_all_lines}" '-[PhotoCleanupMVETests.CrashyTests testCrashyOne]')"
          restarted_fixture_failed="$(/usr/bin/grep -c -E 'Test Case .* failed' Scripts/fixtures/xctest-restarted.log || true)"
          restarted_output_failed="$(printf '%s\n' "${restarted_all_lines}" | /usr/bin/grep -c -E 'Test Case .* failed' || true)"
          if [ -n "${restarted_unique}" ] && [ "${restarted_unique}" -ge 1 ] &&
            [ "${restarted_case_lines}" -ge 1 ] &&
            [ "${restarted_output_failed}" = "${restarted_fixture_failed}" ]; then
            report_ok "组二 unique_count=${restarted_unique}（≥ 1），all 段含 testCrashyOne 的断言失败行 ${restarted_case_lines} 条；Test Case … failed 行：夹具 ${restarted_fixture_failed}，输出 ${restarted_output_failed}"
          else
            report_failure "组二不符：unique_count=${restarted_unique:-空}，testCrashyOne 行 ${restarted_case_lines}，Test Case … failed 行 夹具 ${restarted_fixture_failed}／输出 ${restarted_output_failed}"
          fi

          # 组三：xctest-single-chunk.log（全绿）。
          single_candidates="$(output_field xctest-single-chunk.log candidate_count)"
          single_annotations="$(output_field xctest-single-chunk.log annotation_count)"
          if [ "${single_candidates}" = "0" ] && [ "${single_annotations}" = "0" ]; then
            report_ok "组三 xctest-single-chunk.log candidate_count=0，annotation_count=0"
          else
            report_failure "组三 期望 candidate_count=0、annotation_count=0，实得 ${single_candidates:-空}、${single_annotations:-空}"
          fi

          # 负对照：改前口径（同一条 grep 取尾部 50 行）在 xctest-failures-many.log 上必须丢行——
          # 取满 50 行且不含第一条断言失败行；新口径的 all 段必须含该行。
          # 没有这一条，夹具可能根本不区分新旧口径，自测就成了空转。
          old_logic_lines="$(
            /usr/bin/grep -E 'PhotoCleanupMVE/.*error:|PhotoCleanupMVETests/.*error:|Test Case .* failed' \
              Scripts/fixtures/xctest-failures-many.log | tail -n 50 || true
          )"
          old_logic_count="$(printf '%s\n' "${old_logic_lines}" | /usr/bin/grep -c . || true)"
          first_assertion_location="$(
            /usr/bin/grep -m 1 -E 'PhotoCleanupMVETests/.*error:' Scripts/fixtures/xctest-failures-many.log |
              /usr/bin/sed -nE 's/.*(PhotoCleanupMVETests\/[^:]*:[0-9]+):.*/\1/p' || true
          )"
          old_has_first="$(count_fixed "${old_logic_lines}" "${first_assertion_location}:")"
          new_has_first="$(count_fixed "${many_all_lines}" "${first_assertion_location}:")"
          if [ -n "${first_assertion_location}" ] && [ "${old_logic_count}" = "50" ] &&
            [ "${old_has_first}" = "0" ] && [ "${new_has_first}" = "1" ]; then
            report_ok "负对照：改前口径取到 ${old_logic_count} 行，不含第一条断言失败行（${first_assertion_location}）；新口径 all 段含该行 ${new_has_first} 条"
          else
            report_failure "负对照不成立：改前口径取到 ${old_logic_count} 行，含第一条断言失败行（${first_assertion_location:-空}）${old_has_first} 条；新口径 ${new_has_first} 条"
          fi

          rm -rf "${selftest_dir}"
          if [ "${selftest_failures}" -ne 0 ]; then
            echo "失败行提取自测失败 ${selftest_failures} 项。" >&2
            exit 1
          fi
          echo "失败行提取自测通过。"

      - name: 运行 XCTest
        timeout-minutes: 25
        run: |
          set -o pipefail
          echo "== runner bash 实证（IC-125）=="
          command -v bash
          bash --version | head -n 1
          test_log="$(mktemp -t PhotoCleanupMVE-xctest.XXXXXX)"
          if bash Scripts/test-xcode.sh 2>&1 | tee "$test_log"; then
            test_status=0
          else
            test_status=$?
          fi

          # IC-149 子项 B：项数改由 Scripts/summarize-xctest-log.sh 按「唯一 Test Case
          # 身份去重」统计。旧的 `tail -n 1` 取的是最后一段小计，测试宿主崩溃重启后
          # 日志分段，摘要会少报项数并把前面段落的失败数报成 0（#292 attempt 1：
          # 真实 777 项、1 个用例失败，旧口径报 401 项 0 失败）。
          summary_output="$(bash Scripts/summarize-xctest-log.sh "$test_log" || true)"
          executed_line="$(
            printf '%s\n' "${summary_output}" |
              /usr/bin/sed -n 's/^summary_line=//p' || true
          )"
          restart_count="$(
            printf '%s\n' "${summary_output}" |
              /usr/bin/sed -n 's/^restart_count=//p' || true
          )"
          if [ -n "$executed_line" ]; then
            echo "::notice title=XCTest 执行摘要::$executed_line"
          fi
          if [ -n "${restart_count}" ] && [ "${restart_count}" -gt 0 ]; then
            echo "::notice title=XCTest 宿主重启::本次运行测试宿主重启 ${restart_count} 次，日志分成多段；执行摘要的项数按「唯一 Test Case 身份去重」统计，不取任何一段的 Executed 小计。"
          fi

          # IC-154 子项 B：失败行改由提取脚本扫描整份日志，按「Test Case 失败行 → 测试目标
          # error 行（按文件:行去重）→ 产品目标 error 行 → 结论行」排序并去重。改前只看最后
          # 50 行，前面的断言失败会被丢掉；而 GitHub 每步至多保留 10 条 error 注解、超出的
          # 静默丢弃（#292 attempt 1 发了 22 条只剩最先的 10 条）。所以注解只发脚本给出的
          # 前 10 条，全部去重行连同三个计数写进作业摘要。
          if [ "$test_status" -ne 0 ]; then
            failure_output="$(bash Scripts/extract-xctest-failures.sh "$test_log" || true)"
            failure_candidate_count="$(
              printf '%s\n' "${failure_output}" |
                /usr/bin/sed -n 's/^candidate_count=//p' || true
            )"
            failure_unique_count="$(
              printf '%s\n' "${failure_output}" |
                /usr/bin/sed -n 's/^unique_count=//p' || true
            )"
            failure_annotation_lines="$(
              printf '%s\n' "${failure_output}" |
                /usr/bin/awk '/^--- annotations ---$/ { inside = 1; next } /^--- all ---$/ { inside = 0 } inside' || true
            )"
            failure_all_lines="$(
              printf '%s\n' "${failure_output}" |
                /usr/bin/awk '/^--- all ---$/ { inside = 1; next } inside' || true
            )"
            failure_annotations_sent=0
            if [ -n "${failure_annotation_lines}" ]; then
              while IFS= read -r failure_line; do
                echo "::error title=XCTest 失败::${failure_line}"
                failure_annotations_sent=$((failure_annotations_sent + 1))
              done <<< "${failure_annotation_lines}"
            else
              echo "::error title=XCTest 失败::未找到具体错误行。"
              failure_annotations_sent=1
            fi
            {
              echo "### XCTest 失败行（全量）"
              echo ""
              echo "- 候选行总数：${failure_candidate_count:-空}"
              echo "- 去重后条数：${failure_unique_count:-空}"
              echo "- 已发注解条数：${failure_annotations_sent}"
              if [ -n "${failure_all_lines}" ]; then
                echo ""
                echo '```text'
                printf '%s\n' "${failure_all_lines}"
                echo '```'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # IC-125 哨兵：堵死「脚本没跑任何测试却以 0 退出」的假绿（#238 实例）。
          # 只在 test_status == 0 时介入；非 0 路径原样退出，保留 65 / 1 等失败模式区分。
          executed_count="$(
            printf '%s\n' "$executed_line" |
              /usr/bin/sed -nE 's/.*Executed ([0-9]+) tests?.*/\1/p' || true
          )"
          if [ "$test_status" -eq 0 ] && { [ -z "$executed_count" ] || [ "$executed_count" -le 0 ]; }; then
            echo "::error title=XCTest 哨兵::日志中未出现 Executed N tests（N>0），判定为未执行任何测试，即使退出码为 0 也判失败。test_status=${test_status} executed_count=${executed_count:-空}"
            exit 1
          fi
          exit "$test_status"

      - name: 构建未签名应用
        id: package
        run: |
          set -euo pipefail
          mkdir -p BuildArtifacts
          xcodebuild \
            build \
            -project PhotoCleanupMVE.xcodeproj \
            -scheme PhotoCleanupMVE \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath BuildArtifacts/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          app_path="BuildArtifacts/DerivedData/Build/Products/Release-iphoneos/PhotoCleanupMVE.app"
          if [ ! -d "$app_path" ]; then
            echo "错误：未找到构建后的 PhotoCleanupMVE.app。" >&2
            exit 1
          fi
          if /usr/bin/codesign -d "$app_path" >/dev/null 2>&1; then
            echo "错误：Release 应用意外带有代码签名。" >&2
            exit 1
          fi
          if [ -e "$app_path/_CodeSignature" ] || [ -e "$app_path/embedded.mobileprovision" ]; then
            echo "错误：Release 应用意外包含签名目录或描述文件。" >&2
            exit 1
          fi

          package_root="$(mktemp -d -t PhotoCleanupMVE-package.XXXXXX)"
          mkdir -p "$package_root/Payload"
          ditto "$app_path" "$package_root/Payload/PhotoCleanupMVE.app"
          ditto "$app_path" "BuildArtifacts/PhotoCleanupMVE-unsigned.app"
          (
            cd "$package_root"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/BuildArtifacts/PhotoCleanupMVE-unsigned.ipa" Payload
          )

          if [ ! -f BuildArtifacts/PhotoCleanupMVE-unsigned.ipa ] || \
             [ -L BuildArtifacts/PhotoCleanupMVE-unsigned.ipa ]; then
            echo "错误：IPA 不是预期的普通文件。" >&2
            exit 1
          fi
          test -s BuildArtifacts/PhotoCleanupMVE-unsigned.ipa
          /usr/bin/unzip -tq BuildArtifacts/PhotoCleanupMVE-unsigned.ipa
          ipa_size="$(stat -f '%z' BuildArtifacts/PhotoCleanupMVE-unsigned.ipa)"
          ipa_sha256="$(shasum -a 256 BuildArtifacts/PhotoCleanupMVE-unsigned.ipa | awk '{print $1}')"
          short_sha="$(git rev-parse --short=12 HEAD)"
          printf 'artifact_name=PhotoCleanupMVE-unsigned-%s\n' "$short_sha" >> "$GITHUB_OUTPUT"
          {
            echo "### 未签名 IPA"
            echo "- 文件：PhotoCleanupMVE-unsigned.ipa"
            echo "- 字节数：$ipa_size"
            echo "- SHA-256：$ipa_sha256"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "未签名 IPA 已生成：$ipa_size 字节，SHA-256=$ipa_sha256"
          echo "::notice title=未签名 IPA 校验::文件=PhotoCleanupMVE-unsigned.ipa，字节数=${ipa_size}，SHA-256=${ipa_sha256}"

      - name: 上传可下载的未签名 IPA
        id: upload_unsigned_ipa
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: BuildArtifacts/PhotoCleanupMVE-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          archive: true
